name: "Sync upstream daily"

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/ivanaitzliddat/real-assets-personality-quiz.git || true
          git fetch upstream --tags

      - name: Determine default branch
        id: defbranch
        run: |
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT

      - name: Merge upstream into default branch
        env:
          DEFAULT_BRANCH: ${{ steps.defbranch.outputs.default_branch }}
        run: |
          echo "Default branch: $DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          # Merge upstream changes; this will create a merge commit if necessary.
          git merge --no-edit "upstream/$DEFAULT_BRANCH"

      - name: Push merged changes back to origin
        id: push
        env:
          DEFAULT_BRANCH: ${{ steps.defbranch.outputs.default_branch }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]; then
            echo "Already up to date with upstream."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git push origin "$DEFAULT_BRANCH"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start
      # the Pages deployment explicitly. GH_REPO stops gh from targeting the
      # "upstream" remote added above.
      - name: Deploy synced changes
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ steps.defbranch.outputs.default_branch }}
        run: gh workflow run deploy.yml --ref "$DEFAULT_BRANCH"
